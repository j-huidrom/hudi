<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HUDI | AI Professor</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="layout">

    <div class="left-panel">

        <div id="face" class="face ready">

            <div class="face-ring">

                <div class="ring-glow"></div>

                <div class="ring-rotator">

                    <div class="ring-beam"></div>

                </div>

                <div class="eyes">

                    <div id="leftEye" class="eye"></div>

                    <div id="rightEye" class="eye"></div>

                </div>

                <div id="mouth" class="mouth"></div>

            </div>

        </div>

        <h1>HUDI</h1>

        <div class="title">
            AI Professor
        </div>

        <div class="state">

            ●

            <span id="state">
                READY
            </span>

        </div>

    </div>

    <div class="right-panel">

        <div class="chat-container">

            <div id="chat" class="chat">

            </div>

        </div>

    </div>

</div>

<script src="script.js?v=20"></script>

</body>

</html>
